<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacMark</title>
<style>
  :root {
    --bg: #1e1e1e; --fg: #e6e6e6; --dim: #9a9a9a; --sep: rgba(255,255,255,0.12); --accent: #0a84ff;
    --body: 13px; --small: 11.5px; --title: 20px;
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: var(--body)/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
    display: flex; flex-direction: column;
  }
  /* The header sits under the window's transparent title bar, and moves the window as one (DragWebView). */
  header { position: relative; padding: 34px 18px 14px; display: flex; align-items: center; gap: 14px; }
  #logoBox { position: relative; width: 44px; height: 52px; display: grid; place-items: center; flex: none; }
  #logo, #flash { position: absolute; inset: 0; display: grid; place-items: center; font-size: 46px; line-height: 1; }
  #logo { color: var(--accent); transition: transform 520ms cubic-bezier(.34,1.56,.64,1); }
  #flash { color: var(--fg); opacity: 0; transition: opacity 420ms ease-in; }
  #logoBox.pulse #logo { transform: scale(1.14); transition: transform 110ms ease-out; }
  #logoBox.pulse #flash { opacity: 0.7; transition: opacity 110ms ease-out; }
  #logo span, #flash span { display: block; transform: translateY(-3px); }
  .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .name { display: flex; gap: 10px; align-items: baseline; white-space: nowrap; }
  #host { font-size: var(--title); font-weight: 700; }
  #model { font-size: var(--title); color: var(--dim); }
  .hover { color: var(--dim); white-space: nowrap; }
  .hover:hover { color: var(--fg); }
  button {
    font: inherit; font-size: var(--small); color: var(--fg); background: transparent;
    border: 1px solid var(--sep); border-radius: 6px; padding: 4px 11px; cursor: default;
  }
  button:hover:not(:disabled) { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, transparent); }
  button:disabled { opacity: 0.4; }
  #copy { position: absolute; right: 10px; top: 10px; }
  .sep { height: 1px; background: var(--sep); flex: none; }
  #stage { position: relative; flex: 1; min-height: 0; cursor: grab; }
  #stage:active { cursor: grabbing; }
  footer { display: flex; align-items: center; padding: 8px 10px 8px 14px; gap: 12px; flex: none; }
  #status { flex: 1; min-width: 0; color: var(--dim); font-size: var(--small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shapes { display: flex; gap: 4px; }
  /* Everything drawn: from the window's top, so the sigil's core can fly up into the logo. */
  #cv { position: fixed; left: 0; top: 0; pointer-events: none; }
  /* Rainbow: every hue drawn turns round the spectrum, slowly (greys and
     white stay as they are). Still where motion is reduced. */
  @keyframes spectrum { to { filter: hue-rotate(360deg); } }
  body.rainbow #cv, body.rainbow #logo { animation: spectrum 14s linear infinite; }
  @media (prefers-reduced-motion: reduce) { body.rainbow #cv, body.rainbow #logo { animation: none; } }
  /* Storage's legend, as Storage settings shows it: on hover of the Storage ring or row. */
  #legend {
    position: absolute; width: 300px; padding: 12px 14px; border-radius: 10px; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 88%, var(--fg) 12%); border: 1px solid var(--sep);
    box-shadow: 0 8px 28px rgba(0,0,0,0.28); opacity: 0; transition: opacity 120ms ease; font-size: 12px; z-index: 2;
  }
  #legend.on { opacity: 1; }
  .lg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .lg-head b { font-weight: 600; }
  .lg-head span { color: var(--dim); font-size: 11.5px; }
  .lg-bar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: color-mix(in srgb, var(--fg) 10%, transparent); margin-bottom: 10px; }
  .lg-bar i { display: block; height: 100%; min-width: 2px; border-right: 1px solid var(--bg); }
  .lg-rows { display: grid; grid-template-columns: 10px 1fr auto; gap: 5px 8px; align-items: center; }
  .lg-rows i { width: 10px; height: 10px; border-radius: 50%; }
  .lg-rows span:nth-child(3n) { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
  .lg-note { margin-top: 8px; color: var(--dim); font-size: 11px; line-height: 1.35; }
  #wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>
</head>
<body>
  <header>
    <div id="logoBox"><div id="logo"><span>&#xF8FF;</span></div><div id="flash"><span>&#xF8FF;</span></div></div>
    <div class="who">
      <div class="name"><span id="host">&nbsp;</span><span id="model"></span></div>
      <span id="os" class="hover"></span>
      <span id="ident" class="hover"></span>
    </div>
    <button id="copy" disabled title="Copy everything shown (⌘C)">Copy</button>
  </header>
  <div class="sep"></div>
  <div id="stage"><div id="wait">Reading this Mac…</div><div id="legend"></div></div>
  <div class="sep"></div>
  <footer>
    <div id="status"></div>
    <div class="shapes">
      <button id="bSigil" class="on">Sigil</button>
      <button id="bStrip">Strip</button>
    </div>
  </footer>
  <canvas id="cv"></canvas>

  <script src="Sigil.js"></script>
  <script src="modes/loom.js"></script>
  <script src="modes/spool.js"></script>
  <script src="modes/coin.js"></script>
  <script src="modes/harp.js"></script>
  <script src="modes/breakshot.js"></script>
  <script src="card.js"></script>
</body>
</html>
